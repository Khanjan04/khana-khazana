/* ---------- visitors (guests) ---------- */
REP.guests = () => {
  const bs = billsIn().filter(b => !(b.splitNo > 1)), map = {};
  bs.forEach(b => { const k = dayKey(b.closedAt), m = map[k] || (map[k] = { bills: 0, guests: 0, none: 0 }); m.bills++; m.guests += b.persons || 0; if (!b.persons) m.none++; });
  const days = Object.keys(map).sort().reverse();
  const tot = days.reduce((a, k) => ({ bills: a.bills + map[k].bills, guests: a.guests + map[k].guests, none: a.none + map[k].none }), { bills: 0, guests: 0, none: 0 });
  const seated = inRange(Date.now()) ? openOrders().reduce((a, o) => a + (o.persons || 0), 0) : 0;
  ui.csv = { name: 'visitors', rows: [['Visitors (cover size)', dateLabel()], ['Date', 'Bills', 'Guests'], ...days.map(k => [dmy(k), map[k].bills, map[k].guests]), ['Total', tot.bills, tot.guests]] };
  return `<h2>Visitors (cover size) – ${dateLabel()}</h2>
  <div class="stats"><div class="stat"><small>Total visitors</small><b>${tot.guests}</b></div><div class="stat"><small>Bills</small><b>${tot.bills}</b></div>
    <div class="stat"><small>Bills without guest count</small><b>${tot.none}</b></div>${seated ? `<div class="stat"><small>Seated right now</small><b>${seated}</b></div>` : ''}</div>
  ${days.length ? `<div class="scroll-x"><table class="dt"><thead><tr><th>Date</th><th class="r">Bills</th><th class="r">Guests (visitors)</th></tr></thead><tbody>
    ${days.map(k => `<tr><td>${dmy(k)}</td><td class="r">${map[k].bills}</td><td class="r"><b>${map[k].guests}</b></td></tr>`).join('')}
    <tr class="tt"><td>Total</td><td class="r">${tot.bills}</td><td class="r">${tot.guests}</td></tr></tbody></table></div>` : '<p class="muted">No bills in this period.</p>'}
  <p class="muted">Guests are counted from the “guests” button on the order screen. Ask the captain to enter it for every table.</p>`;
};

/* ---------- time used by each table ---------- */
REP.tables = () => {
  const map = {};
  billsIn().filter(b => b.type === 'dine' && !(b.splitNo > 1)).forEach(b => {
    const min = Math.max(0, Math.round((b.closedAt - b.startedAt) / 60000));
    const m = map[b.tableName] || (map[b.tableName] = { table: b.tableName, section: b.section, times: 0, total: 0, max: 0, guests: 0 });
    m.times++; m.total += min; m.max = Math.max(m.max, min); m.guests += b.persons || 0;
  });
  const rows = Object.values(map).sort((a, b) => b.total - a.total);
  const running = openOrders().filter(o => o.type === 'dine');
  ui.csv = { name: 'table-time', rows: [['Time used by table', dateLabel()], ['Table', 'Section', 'Times used', 'Total minutes', 'Average minutes', 'Longest minutes'], ...rows.map(r => [r.table, r.section, r.times, r.total, Math.round(r.total / r.times), r.max])] };
  return `<h2>Time used by table – ${dateLabel()}</h2>
  ${rows.length ? `<div class="scroll-x"><table class="dt"><thead><tr><th>#</th><th>Table</th><th>Section</th><th class="r">Times used</th><th class="r">Total time</th><th class="r">Average per visit</th><th class="r">Longest</th></tr></thead><tbody>
    ${rows.map((r, i) => `<tr><td>${i + 1}</td><td><b>${esc(r.table)}</b></td><td>${esc(r.section)}</td><td class="r">${r.times}</td><td class="r"><b>${fmtMin(r.total)}</b></td><td class="r">${fmtMin(Math.round(r.total / r.times))}</td><td class="r">${fmtMin(r.max)}</td></tr>`).join('')}</tbody></table></div>` : '<p class="muted">No dine-in bills in this period.</p>'}
  ${running.length && inRange(Date.now()) ? `<div class="card" style="margin-top:14px"><h3>Tables running now</h3>${running.map(o => `<div class="kvr"><span><b>${esc(o.tableName)}</b> ${esc(o.section)}</span><span>${fmtMin(minsAgo(o.startedAt))}</span></div>`).join('')}</div>` : ''}
  <p class="muted">Time = from the first order on the table until the bill is settled. Tables are listed with the longest total time first.</p>`;
};

/* ---------- most ordered items (highest first) ---------- */
REP.items = () => {
  const map = {};
  billsIn().forEach(b => b.lines.forEach(l => {
    const k = l.itemId === 'open' ? 'open:' + l.name : l.itemId, m = map[k] || (map[k] = { name: l.itemId === 'open' ? l.name + ' (open item)' : l.name, qty: 0, amt: 0 });
    m.qty += l.qty; m.amt += lineTotal(l);
  }));
  const rows = Object.values(map).sort((a, b) => b.qty - a.qty || b.amt - a.amt);
  const totQ = rows.reduce((a, r) => a + r.qty, 0), totA = r2(rows.reduce((a, r) => a + r.amt, 0));
  ui.csv = { name: 'most-ordered-items', rows: [['Most ordered items', dateLabel()], ['Rank', 'Item', 'Quantity', 'Amount'], ...rows.map((r, i) => [i + 1, r.name, r.qty, r2(r.amt)])] };
  return `<h2>Most ordered items – ${dateLabel()}</h2>
  ${rows.length ? `<div class="scroll-x"><table class="dt"><thead><tr><th>Rank</th><th>Item</th><th class="r">Quantity</th><th class="r">Amount</th></tr></thead><tbody>
    ${rows.map((r, i) => `<tr><td>${i + 1}</td><td><b>${esc(r.name)}</b></td><td class="r"><b>${r.qty}</b></td><td class="r">${money(r.amt, 2)}</td></tr>`).join('')}
    <tr class="tt"><td></td><td>Total</td><td class="r">${totQ}</td><td class="r">${money(totA, 2)}</td></tr></tbody></table></div>` : '<p class="muted">No items sold in this period.</p>'}`;
};

/* ---------- deleted items record ---------- */
REP.voids = () => {
  const rows = db.voidLog.filter(v => inRange(v.time)).sort((a, b) => b.time - a.time);
  ui.csv = { name: 'deleted-items', rows: [['Deleted items', dateLabel()], ['Date', 'Time', 'Table/Order', 'Item', 'Qty', 'Amount', 'KOT', 'Reason', 'Deleted by', 'Approved by'], ...rows.map(v => [dmy(dayKey(v.time)), hm(v.time), v.table, v.item, v.qty, v.amount, v.kot, v.reason, v.by, v.approvedBy])] };
  return `<h2>Deleted items – ${dateLabel()}</h2>
  ${rows.length ? `<div class="scroll-x"><table class="dt"><thead><tr><th>Date &amp; time</th><th>Table</th><th>Item</th><th class="r">Qty</th><th class="r">Amount</th><th>KOT</th><th>Reason</th><th>By</th><th>Approved</th></tr></thead><tbody>
    ${rows.map(v => `<tr><td>${dmy(dayKey(v.time))} ${hm(v.time)}</td><td>${esc(v.table)}</td><td>${esc(v.item)}</td><td class="r">${v.qty}</td><td class="r">${money(v.amount, 2)}</td><td>${v.kot ? 'KOT ' + v.kot : '-'}</td><td>${esc(v.reason)}</td><td>${esc(v.by)}</td><td>${esc(v.approvedBy)}</td></tr>`).join('')}</tbody></table></div>` : '<p class="muted">No item was deleted in this period.</p>'}`;
};

/* =====================================================================
   START-UP & EVENTS
   ===================================================================== */
RCPT_CSS = ".rcpt{font-family:'Courier New',ui-monospace,Menlo,monospace;font-size:12px;line-height:1.35;color:#000;width:100%}\n.rcpt .c{text-align:center}\n.rcpt .b{font-weight:700}\n.rcpt .big{font-size:15px;font-weight:700}\n.rcpt .nm{font-size:17px;font-weight:700;letter-spacing:.03em}\n.rcpt hr{border:0;border-top:1px dashed #000;margin:5px 0}\n.rcpt table{width:100%;border-collapse:collapse}\n.rcpt td,.rcpt th{padding:1px 0;vertical-align:top;text-align:left;font-weight:inherit}\n.rcpt th{border-bottom:1px dashed #000;font-weight:700}\n.rcpt .r{text-align:right}\n.rcpt .sub td{font-style:italic;font-size:11px;padding-left:8px}\n.rcpt .kt td{font-size:14px;font-weight:700}\n.rcpt .kt.sub td{font-size:12px;font-weight:400}\n.rcpt .cx{text-decoration:line-through}\n.rcpt .tot td{font-size:15px;font-weight:700;border-top:1px dashed #000;padding-top:3px}\n.rcpt .gap{height:6px}\n";

document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]');
  if (!el || el.disabled) return;
  const fn = ACT[el.dataset.act];
  if (fn) { if (el.tagName !== 'A') e.preventDefault(); fn(el, e); }
});
document.addEventListener('change', e => {
  const el = e.target.closest('[data-ch]');
  if (el && CH[el.dataset.ch]) CH[el.dataset.ch](el, e);
});
document.addEventListener('input', e => {
  const el = e.target.closest('[data-in]');
  if (el && IN[el.dataset.in]) IN[el.dataset.in](el, e);
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && ui.modal) { closeModal(); return; }
  if (e.key === 'Enter') {
    const el = e.target.closest('[data-enter]');
    if (el && ACT[el.dataset.enter]) { e.preventDefault(); ACT[el.dataset.enter](el, e); return; }
  }
  if ((e.key === 'Enter' || e.key === ' ') && e.target.classList && e.target.classList.contains('tbl')) { e.preventDefault(); ACT.openTable(e.target); }
});

/* remove orders that were left empty (e.g. app closed while a table was open) */
Object.keys(db.orders).forEach(id => { if (!db.orders[id].lines.some(l => !l.void)) delete db.orders[id]; });

/* keep "minutes running" fresh on the table / kitchen screens */
setInterval(() => { if ((ui.screen === 'tables' || ui.screen === 'kitchen') && !ui.modal) render(); }, 30000);

/* first page: login. If the project is live and someone is already logged in, go straight to home. */
ui.screen = (db.settings.live && curUser()) ? 'home' : 'login';
render();

</script>
