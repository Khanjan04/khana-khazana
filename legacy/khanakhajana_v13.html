<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0f5257">
<title>KHANAKHAJANA MANAGEMENT – Billing</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%8D%9B%3C/text%3E%3C/svg%3E">
<style>
:root{
  --ink:#22282b;--muted:#68757a;--paper:#e9ebec;--card:#fff;--line:#d5dadc;
  --red:#d62a35;--red2:#ad1f28;--red3:#fdecee;
  --char:#4d5356;--char2:#3a4043;--char3:#5f676b;
  --blue:#1b93d1;--gold:#f2a400;--gold2:#fff1cc;--chilli:#c5352b;--chilli2:#fde8e6;
  --leaf:#3bb063;--leaf2:#d9f2e2;--sun:#ffd233;--run:#8fcff6;--prt:#79c98f;--hold:#ffc78a;
  --veg:#17803d;--egg:#c88a00;--non:#c62828;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{font:16px/1.4 'Segoe UI',system-ui,-apple-system,Roboto,'Noto Sans','Noto Sans Devanagari','Noto Sans Gujarati',sans-serif;color:var(--ink);background:var(--paper);-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0}
input,select,textarea{font:inherit;color:inherit}
a{color:inherit}
svg.ic{display:inline-block;vertical-align:middle;flex:none}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.muted{color:var(--muted)}
.sp{flex:1}
[hidden]{display:none!important}

/* ---------- app frame & top bar (like the reference screens) ---------- */
.app{min-height:100vh;display:flex;flex-direction:column}
.app.fixed{height:100vh;overflow:hidden}
.top{background:#fff;color:var(--ink);display:flex;align-items:center;gap:10px;padding:6px 14px;min-height:64px;position:sticky;top:0;z-index:30;flex:none;border-bottom:1px solid var(--line);box-shadow:0 1px 4px rgba(0,0,0,.06)}
.brand{font:700 21px/1 Georgia,'Times New Roman',serif;letter-spacing:.05em;white-space:nowrap;color:var(--red)}
.brand small{display:block;font:600 10px/1.3 'Segoe UI',system-ui,sans-serif;letter-spacing:.24em;color:var(--muted);margin-top:3px}
.ttl{white-space:nowrap;font-size:17px;font-weight:700;padding-left:12px;border-left:2px solid var(--line);color:var(--char)}
.tb-back{display:flex;align-items:center;gap:2px;border:2px solid var(--line);border-radius:10px;padding:6px 12px 6px 6px;font-weight:700;color:var(--char)}
.tb-back:active{background:#eef0f1}
.newo{background:var(--red);color:#fff;font-weight:700;border-radius:6px;padding:8px 14px;white-space:nowrap}
.newo:active{background:var(--red2)}
.billno{width:120px;height:38px;border:2px solid var(--line);border-radius:6px;padding:0 10px;background:#fff}
.billno:focus{outline:none;border-color:var(--red)}
.tbicons{display:flex;gap:2px}
.tbi{width:42px;height:42px;border-radius:10px;display:grid;place-items:center;color:var(--char)}
.tbi:hover{background:#f0f2f3}
.tbi:active{background:var(--red3);color:var(--red)}
.tbi.locked{opacity:.35}
.tbi.on{color:var(--red);background:var(--red3)}
.chip{display:flex;align-items:center;gap:6px;background:#f0f2f3;padding:6px 12px;border-radius:999px;font-size:14px;font-weight:700;white-space:nowrap}
.chip em{font-style:normal;font-weight:500;color:var(--muted);font-size:12px}
.help{margin-left:4px;text-align:right;border:2px solid #cfd5d7;border-radius:10px;padding:3px 12px;line-height:1.2;font-size:12px;white-space:nowrap;background:#fff}
.help .hl{color:var(--muted);font-size:11px}
.help a{display:block;text-decoration:none}
.help .ph{font-weight:800;font-size:16px;letter-spacing:.02em;color:var(--red)}

/* ---------- buttons & fields ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 18px;border-radius:8px;font-weight:700;background:#fff;border:2px solid var(--line);white-space:nowrap}
.btn:active{transform:translateY(1px)}
.btn.pri{background:var(--red);border-color:var(--red);color:#fff}
.btn.dark{background:var(--char);border-color:var(--char);color:#fff}
.btn.gold{background:var(--gold);border-color:var(--gold);color:#2a1d00}
.btn.red{background:var(--chilli);border-color:var(--chilli);color:#fff}
.btn.grn{background:var(--leaf);border-color:var(--leaf);color:#fff}
.btn.ghost{background:transparent}
.btn.sm{min-height:34px;padding:0 12px;font-size:14px;border-radius:7px}
.btn.lg{min-height:54px;font-size:18px;padding:0 26px}
.btn[disabled]{opacity:.45;pointer-events:none}
.btn.locked{opacity:.6}
.ibtn{width:36px;height:36px;border-radius:8px;display:inline-grid;place-items:center;color:var(--muted)}
.ibtn:hover{background:#e6ebe8}
.ibtn.dng{color:var(--chilli)}
.ibtn.on{color:var(--gold)}
.in,select.in,textarea.in{width:100%;min-height:44px;border:2px solid var(--line);border-radius:8px;padding:8px 12px;background:#fff}
.in:focus{border-color:var(--red);outline:none}
.in.sm{min-height:36px;padding:4px 8px;border-radius:7px}
label.f{display:block;font-weight:600;font-size:14px;margin:12px 0 4px}
.err{color:var(--chilli);font-weight:600}

/* ---------- home ---------- */
.home{max-width:1000px;width:100%;margin:0 auto;padding:34px 20px 40px}
.home h1{font:700 30px/1.15 Georgia,serif;margin:0 0 4px}
.big3{display:grid;grid-template-columns:repeat(3,1fr);gap:18px;margin:26px 0 22px}
.bt{background:#fff;border:2px solid var(--line);border-radius:16px;padding:30px 16px 24px;display:flex;flex-direction:column;align-items:center;gap:8px;position:relative;transition:transform .12s,box-shadow .12s}
.bt:hover{box-shadow:0 6px 18px rgba(0,0,0,.12)}
.bt:active{transform:scale(.98)}
.bt b{font-size:26px}
.bt span{color:var(--muted);font-size:15px}
.bt .badge{width:92px;height:92px;border-radius:50%;display:grid;place-items:center;margin-bottom:6px}
.bt.dine .badge{background:var(--red3);color:var(--red)}
.bt.del .badge{background:var(--gold2);color:#a56d00}
.bt.pk .badge{background:var(--leaf2);color:#1c7440}
.bt.locked{opacity:.55}
.row2{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.mini{background:#fff;border:2px solid var(--line);border-radius:12px;padding:14px 16px;display:flex;align-items:center;gap:12px;text-align:left;font-weight:700}
.mini small{display:block;font-weight:500;color:var(--muted)}
.mini .ic{color:var(--red)}
.mini.locked{opacity:.5}
.demo{background:var(--gold2);border:1px solid #f0d58a;border-radius:10px;padding:8px 12px;font-size:14px;margin-top:18px}

/* ---------- login ---------- */
.login{flex:1;display:grid;place-items:center;padding:22px}
.lcard{width:100%;max-width:400px;background:#fff;border-radius:18px;padding:26px 24px 22px;box-shadow:0 10px 40px rgba(0,0,0,.15)}
.lcard h1{font:700 26px/1.1 Georgia,serif;margin:0 0 2px;text-align:center;color:var(--red)}
.lcard .sub{text-align:center;color:var(--muted);margin-bottom:8px}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:12px 0}
.pad button{height:56px;border-radius:12px;background:#f1f4f2;font-size:22px;font-weight:700;border:1px solid var(--line)}
.pad button:active{background:var(--red3)}
.pin{letter-spacing:.5em;text-align:center;font-size:22px}
.shake{animation:shake .3s}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}

/* ---------- table view ---------- */
.tables{padding:12px 22px 40px;max-width:1400px;width:100%;margin:0 auto}
.tvh{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin:6px 0 4px}
.tvh h2{margin:0;font-size:19px;color:var(--char)}
.tvh .r{margin-left:auto;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.rbtn{background:var(--red);color:#fff;font-weight:700;border-radius:6px;padding:8px 16px}
.rbtn:active{background:var(--red2)}
.rbtn.o{background:#fff;color:var(--red);border:2px solid var(--red)}
.refr{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;color:var(--char)}
.legend{display:flex;flex-wrap:wrap;gap:6px 18px;font-size:14px;color:var(--muted);align-items:center;margin:8px 0}
.legend i{display:inline-block;width:14px;height:14px;border-radius:50%;margin-right:6px;vertical-align:-2px;border:1px solid #b9c1c3;background:#eee}
.legend i.running,.tbl.running{background:var(--run);border-color:#5aaee0}
.legend i.kot,.tbl.kot{background:var(--sun);border-color:#d9a900}
.legend i.printed,.tbl.printed{background:var(--prt);border-color:#4ea96a}
.legend i.hold,.tbl.hold{background:var(--hold);border-color:#e08a1e}
.sec{margin:16px 0 6px}
.sec h3{margin:0 0 8px;font-size:15px;color:var(--red);font-weight:600}
.trow{display:flex;gap:12px;margin-bottom:12px;flex-wrap:wrap}
.tbl{width:104px;height:96px;border-radius:12px;border:2px dashed #b7c1bd;background:#f3f3f3;position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;cursor:pointer;user-select:none;transition:transform .1s}
.tbl:active{transform:scale(.97)}
.tbl .tn{font-size:21px;font-weight:800;letter-spacing:.02em}
.tbl .ts{font-size:12px;color:var(--muted);font-weight:600}
.tbl .tm{font-size:11.5px;font-weight:700;color:#3d4649}
.tbl .ta{font-size:14px;font-weight:800}
.tbl.running,.tbl.kot,.tbl.printed,.tbl.hold{border-style:solid}
.pips{display:flex;gap:3px;height:7px}
.pips i{width:7px;height:7px;border-radius:50%;background:#a9b6b2}
.tbl .ico{position:absolute;bottom:-11px;left:0;right:0;display:flex;justify-content:center;gap:6px}
.tbl .ico button{width:30px;height:24px;border-radius:7px;background:#fff;border:1.5px solid rgba(0,0,0,.4);display:grid;place-items:center}
.tbl.hasico{margin-bottom:10px;justify-content:flex-start;padding-top:8px}

/* ---------- order screen ---------- */
.order{flex:1;display:flex;min-height:0;position:relative}
.groups{width:3in;flex:none;background:var(--char);color:#fff;display:flex;flex-direction:column;min-height:0}
.ph2{height:52px;flex:none;display:flex;align-items:center;justify-content:space-between;padding:0 16px;font-weight:800;font-size:15px;background:var(--blue);color:#fff}
.glist{overflow:auto;flex:1}
.g{display:flex;align-items:center;gap:8px;width:100%;text-align:left;padding:14px 16px;font-weight:700;font-size:16.5px;border-bottom:1px solid #6b7276;background:var(--char);color:#f1f3f4}
.g.on{background:var(--leaf);color:#fff}
.g .ic{color:var(--sun)}
.sg{display:block;width:100%;text-align:left;padding:11px 16px 11px 30px;font-size:15px;background:var(--char3);border-bottom:1px solid #6b7276;font-weight:600;color:#eef1f2}
.sg.on{background:#d9f2e2;color:#155a31;box-shadow:inset 5px 0 0 var(--leaf)}
.mid{flex:1;display:flex;flex-direction:column;min-width:0;min-height:0;background:var(--paper)}
.mtop{min-height:52px;flex:none;display:flex;align-items:center;gap:10px;padding:5px 12px;background:#dfe2e3;border-bottom:1px solid var(--line);position:relative}
.srch{position:relative;flex:1;max-width:460px}
.srch .ic{position:absolute;left:11px;top:50%;transform:translateY(-50%);color:var(--muted)}
.srch input{width:100%;height:40px;border-radius:6px;border:2px solid #fff;padding:0 36px 0 36px;background:#fff}
.srch input:focus{outline:none;border-color:var(--red)}
.srch .clr{position:absolute;right:2px;top:50%;transform:translateY(-50%);width:32px;height:32px}
.scbox{position:relative;width:190px;flex:none}
.scbox input{width:100%;height:40px;border-radius:6px;border:2px solid #fff;padding:0 10px;background:#fff;text-transform:uppercase}
.scbox input::placeholder{text-transform:none}
.scbox input:focus{outline:none;border-color:var(--red)}
.scl{position:absolute;top:44px;left:0;min-width:270px;background:#fff;border:1px solid var(--line);border-radius:8px;box-shadow:0 8px 24px rgba(0,0,0,.25);z-index:20;overflow:hidden}
.scl button{display:flex;justify-content:space-between;gap:10px;width:100%;text-align:left;padding:9px 12px;border-bottom:1px solid #eef1f2;font-weight:600}
.scl button:hover,.scl button.on{background:var(--gold2)}
.scl small{color:var(--muted);font-weight:700;white-space:nowrap}
.mtitle{font-weight:700;color:var(--char);white-space:nowrap;margin-left:auto}
.subchips{display:none}
.items{overflow:auto;padding:14px;display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));grid-auto-rows:max-content;gap:10px;align-content:start;flex:1}
.sh{grid-column:1/-1;font-weight:800;color:var(--red);border-bottom:2px solid #d5d9db;padding:8px 2px 4px;margin-top:6px}
.sh:first-child{margin-top:0}
.it{position:relative;background:#fff;border:1px solid var(--line);border-left:5px solid #b9c3c0;border-radius:6px;padding:9px 9px 7px;min-height:78px;text-align:left;display:flex;flex-direction:column;justify-content:space-between;gap:4px}
.it:active{background:var(--gold2)}
.it.v{border-left-color:#2fa860}
.it.e{border-left-color:#f2b800}
.it.n{border-left-color:var(--non)}
.it b{font-size:15px;line-height:1.2;font-weight:700}
.it.v b{color:var(--veg)}
.it.e b{color:var(--egg)}
.it.n b{color:var(--non)}
.it .pr{color:var(--muted);font-weight:700;font-size:13.5px}
.it .cd{position:absolute;right:7px;bottom:6px;font-size:10.5px;font-weight:700;color:#8a969b;letter-spacing:.03em}
.it .lb{font-size:11.5px;color:var(--muted);font-weight:500}
.it .qb{position:absolute;top:-9px;right:-7px;min-width:26px;height:26px;padding:0 6px;border-radius:13px;background:var(--gold);color:#2a1d00;font-weight:800;display:grid;place-items:center;font-size:14px;box-shadow:0 1px 4px rgba(0,0,0,.25)}
.it .ti{display:block;width:calc(100% + 14px);height:120px;margin:-9px -9px 5px -9px;object-fit:contain;border-radius:5px 5px 0 0;background:#eceff0}
.it.hasimg{justify-content:flex-start}
.it.hasimg .pr{margin-top:auto}
.it.off{opacity:.45;pointer-events:none}
.it.open{border-left-color:#8a969b;border-style:dashed;border-left-style:solid;background:#fafafa}
.empty{grid-column:1/-1;text-align:center;color:var(--muted);padding:40px 10px}

.cart{width:430px;flex:none;display:flex;flex-direction:column;background:#fff;border-left:1px solid var(--line);min-height:0}
.ctabs{display:grid;grid-template-columns:repeat(3,1fr);flex:none}
.ctabs span{background:var(--char2);color:#fff;text-align:center;padding:10px 4px;font-weight:700;font-size:14px}
.ctabs span.on{background:var(--red)}
.cicons{display:flex;align-items:stretch;flex:none;border-bottom:1px solid var(--line);background:#fff}
.cicons button,.cicons .ci{width:58px;height:48px;display:grid;place-items:center;color:#6a757a;border-right:1px solid var(--line);position:relative}
.cicons button:active{background:var(--red3)}
.cicons button.on{color:var(--red);background:var(--red3)}
.cicons .ci b{position:absolute;bottom:0;font-size:12px;color:var(--red);left:0;right:0;text-align:center;line-height:1}
.cicons .bd{position:absolute;top:3px;right:6px;background:var(--red);color:#fff;border-radius:9px;min-width:17px;height:17px;font-size:11px;font-weight:800;display:grid;place-items:center;padding:0 4px}
.cicons .sect{margin-left:auto;background:var(--sun);color:#3d3000;font-weight:800;font-size:13px;display:flex;align-items:center;padding:0 14px;max-width:150px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.cnote{padding:6px 12px;background:#fff8e1;border-bottom:1px solid #f0e2a8;font-size:13.5px;color:#6b5200;flex:none}
.cust{flex:none;padding:8px 12px 10px;border-bottom:1px solid var(--line);background:#fafbfb}
.cust .fr{display:grid;grid-template-columns:70px 1fr;align-items:center;gap:6px 8px;margin-top:6px}
.cust .fr label{font-size:13px;font-weight:600;color:var(--muted)}
.cust .in{min-height:36px;padding:3px 8px}
.cust .cr{display:flex;gap:6px;align-items:center}
.cust .tg{background:var(--blue);color:#fff;border-radius:4px;padding:2px 8px;font-size:13px;font-weight:700;display:inline-flex;gap:6px;align-items:center;white-space:nowrap}
.lines{flex:1;overflow:auto;min-height:60px}
.lh{display:grid;grid-template-columns:34px 1fr 82px;padding:5px 12px;font-size:12px;font-weight:700;color:var(--red);border-bottom:1px solid var(--line);position:sticky;top:0;background:#fff;z-index:2}
.lh span:last-child{text-align:right}
.kh{background:#dfe2e3;font-size:12.5px;font-weight:800;padding:5px 14px;color:#3d4649;display:flex;justify-content:space-between}
.kh.new{background:var(--gold2);color:#7a5200}
.ln{display:grid;grid-template-columns:34px 1fr auto;gap:8px;padding:8px 12px;border-bottom:1px solid #edf1ef;align-items:center}
.ln .rm{width:28px;height:28px;border-radius:50%;background:var(--red);color:#fff;display:grid;place-items:center}
.ln .lk{width:28px;height:28px}
.ln .nm{font-weight:600;text-align:left;line-height:1.25}
.ln .nm u{text-decoration:underline;text-decoration-color:#b5bfc3;text-underline-offset:3px}
.ln .nm.v u{color:var(--veg)}.ln .nm.e u{color:var(--egg)}.ln .nm.n u{color:var(--non)}
.ln .sb{font-size:12.5px;color:var(--muted);margin-top:2px}
.ln .sb i{font-style:normal;color:#8a5a00;background:var(--gold2);border-radius:5px;padding:0 5px;margin-right:4px;display:inline-block}
.ln .am{text-align:right;font-weight:700;min-width:64px}
.ln .stp{display:flex;align-items:center;gap:4px;margin-top:5px}
.ln.void .nm{text-decoration:line-through;color:#98a5a1}
.stp{display:flex;align-items:center;gap:4px}
.stp button{width:30px;height:30px;border-radius:6px;border:1.5px solid var(--line);display:grid;place-items:center;background:#fff}
.stp b{min-width:30px;text-align:center}
.stp .nbtn{width:auto;padding:0 10px;margin-left:8px;display:flex;align-items:center;gap:4px;font-size:12.5px;font-weight:700;color:var(--muted)}
.stp .nbtn.on{color:var(--red);border-color:var(--red);background:var(--red3)}
.cempty{padding:36px 20px;text-align:center;color:var(--muted)}
.bar{flex:none;background:var(--char2);color:#fff;padding:7px 12px;display:flex;align-items:center;gap:9px;position:relative}
.bar .sbtn{background:var(--red);color:#fff;font-weight:700;border-radius:5px;padding:6px 14px;font-size:14px}
.bar .tot{margin-left:auto;display:flex;align-items:baseline;gap:8px}
.bar .tot span{font-size:13px;opacity:.85}
.bar .tot b{font-size:27px;color:var(--sun);line-height:1}
.chkrow{flex:none;background:var(--char3);color:#dfe4e6;padding:0 12px 7px;display:flex;align-items:center;gap:10px;font-size:11.5px}
.ck{white-space:nowrap;display:inline-flex;align-items:center;gap:6px;font-size:14px;font-weight:600;color:#fff}
.ck i{width:18px;height:18px;border:2px solid #cfd5d7;border-radius:4px;display:inline-grid;place-items:center;background:#fff}
.ck.on i{background:var(--red);border-color:var(--red)}
.ck.on i::after{content:"";width:9px;height:5px;border-left:2.5px solid #fff;border-bottom:2.5px solid #fff;transform:rotate(-45deg) translate(1px,-1px)}
.handle{position:absolute;left:50%;top:-14px;transform:translateX(-50%);width:54px;height:16px;background:var(--char2);border-radius:8px 8px 0 0;color:#fff;display:grid;place-items:center}
.sumd{flex:none;background:var(--char);color:#fff;padding:6px 14px}
.sumd .r{display:flex;justify-content:space-between;font-size:14px;padding:1px 0}
.sumd .r button{display:flex;justify-content:space-between;width:100%;font-size:14px}
.pays{flex:none;background:var(--char3);color:#fff;display:flex;justify-content:space-around;padding:8px 6px}
.rd{display:inline-flex;align-items:center;gap:5px;font-size:14px;font-weight:600;color:#fff;padding:2px 3px}
.rd i{width:17px;height:17px;border-radius:50%;background:#fff;border:2px solid #cfd5d7;display:inline-grid;place-items:center}
.rd.on i::after{content:"";width:9px;height:9px;border-radius:50%;background:var(--red)}
.btns{flex:none;padding:7px 8px 9px;background:var(--char3);display:grid;gap:6px}
.brow{display:grid;gap:6px}
.brow.r6{grid-template-columns:repeat(6,1fr)}
.brow.r3{grid-template-columns:repeat(3,1fr)}
.ab{min-height:46px;border-radius:5px;font-weight:700;font-size:12.5px;line-height:1.1;padding:4px 3px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;text-align:center;border:2px solid transparent}
.ab:active{transform:translateY(1px);filter:brightness(.92)}
.ab.a1{background:var(--red);color:#fff}
.ab.kt{background:var(--char2);color:#fff}
.ab.hd{background:#fff;border-color:#9aa8a4;color:#39464b}
.ab.ol{background:#fff;border-color:transparent;color:var(--ink);font-size:14px;min-height:42px}
.ab.ol small{font-weight:700;color:var(--red)}
.ab.locked{opacity:.55}
.cartbar,.cartclose{display:none}

/* ---------- lists, cards, reports ---------- */
.page{padding:16px 22px 40px;max-width:1200px;width:100%;margin:0 auto}
.page h2{margin:0 0 12px;font-size:22px}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}
.ocard{background:#fff;border:2px solid var(--line);border-radius:12px;padding:12px 14px;text-align:left;display:flex;flex-direction:column;gap:4px}
.ocard.kot{border-color:#d9a900;background:#fffbe6}
.ocard.hold{border-color:#e08a1e;background:#fff3e6}
.ocard.printed{border-color:#4ea96a;background:#f0faf3}
.ocard .h{display:flex;justify-content:space-between;align-items:baseline;font-weight:800;font-size:18px}
.tag{display:inline-block;font-size:12px;font-weight:700;padding:2px 8px;border-radius:999px;background:#e6ebe8;color:#41525a}
.tag.g{background:var(--leaf2);color:#155a31}.tag.y{background:var(--gold2);color:#7a5200}.tag.o{background:#ffe0bf;color:#8a4b00}.tag.r{background:var(--chilli2);color:#8c1f18}
.plat{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.plat button{border:2px solid var(--line);border-radius:10px;padding:16px 8px;font-weight:800;font-size:18px;background:#fff}
.plat button.on{border-color:var(--red);background:var(--red3)}
.kots{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.kcard{background:#fff;border:2px solid #d9a900;border-radius:12px;overflow:hidden}
.kcard header{background:var(--sun);padding:8px 12px;display:flex;justify-content:space-between;font-weight:800}
.kcard .kb{padding:10px 12px;font-size:15px}
.kcard .kb div.sb{font-size:12.5px;color:var(--muted);padding-left:14px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin:12px 0}
.stat{background:#fff;border:2px solid var(--line);border-radius:10px;padding:10px 14px}
.stat small{color:var(--muted);font-weight:600}
.stat b{display:block;font-size:24px}
.stat.ok{border-color:#4ea96a;background:#f0faf3}
.stat.bad{border-color:var(--chilli);background:var(--chilli2)}
table.dt{width:100%;border-collapse:collapse;background:#fff;border-radius:10px;overflow:hidden}
table.dt th,table.dt td{padding:9px 10px;border-bottom:1px solid #e6ebe8;text-align:left;vertical-align:middle}
table.dt th{background:#e4e7e8;font-size:13px}
table.dt td.r,table.dt th.r{text-align:right}
table.dt tr.tt td{font-weight:800;background:#f3f5f5}
.scroll-x{overflow-x:auto}
.rtabs{display:flex;gap:4px;flex-wrap:wrap;border-bottom:2px solid var(--line);margin-bottom:12px}
.rtabs button{padding:10px 16px;font-weight:700;color:var(--muted);border-bottom:4px solid transparent;margin-bottom:-2px}
.rtabs button.on{color:var(--red);border-bottom-color:var(--red)}
.rbar{display:flex;gap:10px;align-items:end;flex-wrap:wrap;margin-bottom:8px}
.rbar .in{width:auto;min-height:40px}
.rbar .r{margin-left:auto;display:flex;gap:8px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.card{background:#fff;border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin-bottom:14px}
.card h3{margin:0 0 8px;font-size:17px}
.kvr{display:flex;justify-content:space-between;padding:4px 0;border-bottom:1px dotted #d9dfe1}
.kvr.b{font-weight:800;border-bottom:2px solid var(--ink);font-size:17px}

/* part payment page */
.part .tabs4{display:grid;grid-template-columns:repeat(4,1fr);border:1px solid var(--line);background:#fff;margin:12px 0}
.part .tabs4 button{padding:12px 6px;display:flex;flex-direction:column;align-items:center;gap:4px;font-weight:700;font-size:14px;color:var(--muted);border-right:1px solid var(--line)}
.part .tabs4 button.on{color:var(--red);background:var(--red3)}
.part .box{background:#fff;border:1px solid var(--line);padding:14px 16px}
.part .sumbox{background:#fff8e1;border:1px solid #f0e2a8;margin-top:14px}
.part .sumbox .kvr{padding:9px 14px;border-bottom:1px solid #f0e2a8}

/* ---------- modal & toast ---------- */
.mback{position:fixed;inset:0;background:rgba(10,20,25,.6);z-index:100;display:flex;align-items:center;justify-content:center;padding:14px}
.modal{background:#fff;border-radius:12px;width:100%;max-width:560px;max-height:94vh;display:flex;flex-direction:column;overflow:hidden;box-shadow:0 20px 60px rgba(0,0,0,.4)}
.modal.wide{max-width:760px}
.modal.narrow{max-width:430px}
.mh{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;border-bottom:1px solid var(--line);font-size:17px;font-weight:800;gap:10px}
.mb{padding:6px 16px 14px;overflow:auto;flex:1}
.mf{padding:12px 16px;border-top:1px solid var(--line);display:flex;gap:10px;justify-content:flex-end;align-items:center;background:#f7f9f8;flex-wrap:wrap}
.mf .tot{margin-right:auto;font-weight:800;font-size:20px}
.opts{display:flex;flex-wrap:wrap;gap:8px}
.opt{border:2px solid var(--line);border-radius:8px;padding:10px 16px;font-weight:700;background:#fff;text-align:center;min-width:100px}
.opt small{display:block;font-weight:600;color:var(--muted)}
.opt.on{background:var(--red);border-color:var(--red);color:#fff}
.opt.on small{color:#ffd9dc}
.radios{display:flex;flex-wrap:wrap;gap:10px 18px;margin:6px 0}
.radios .rd{color:var(--ink);font-size:15px}
.radios .rd i{border-color:#9aa5a9}
.xtra{display:flex;align-items:center;gap:8px;border:2px solid var(--line);border-radius:8px;padding:6px 6px 6px 12px}
.xtra.on{border-color:var(--leaf);background:#f1faf4}
.xtra .stp{margin:0}
.chips{display:flex;flex-wrap:wrap;gap:7px}
.ntags{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0 2px;min-height:30px;align-items:center}
.ntag{background:var(--leaf);color:#fff;border-radius:6px;padding:4px 6px 4px 11px;font-weight:700;display:inline-flex;gap:6px;align-items:center}
.ntag button{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;color:#fff}
.ntag button:hover{background:rgba(0,0,0,.2)}
.chp{border:2px solid var(--line);border-radius:999px;padding:7px 14px;font-weight:600;background:#fff}
.chp.on{background:var(--leaf);border-color:var(--leaf);color:#fff}
.tw{position:fixed;left:50%;top:76px;transform:translateX(-50%);z-index:200;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none;width:max-content;max-width:92vw}
.toast{background:#1f2f35;color:#fff;padding:11px 20px;border-radius:10px;font-weight:600;box-shadow:0 6px 20px rgba(0,0,0,.35);max-width:90vw}
.toast.err{background:var(--chilli)}
.toast.ok{background:#1c6a3d}
.qamt{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.qamt button{padding:6px 12px;border-radius:7px;background:#eef2f0;font-weight:700;border:1px solid var(--line)}
.kv{display:flex;justify-content:space-between;padding:3px 0}
.kv.b{font-weight:800;font-size:19px;border-top:2px solid var(--ink);margin-top:4px;padding-top:6px}
.paper{background:#fffef8;border:1px dashed #b8b39c;padding:12px;margin:10px auto;max-width:330px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 16px}

/* ---------- admin ---------- */
.adm{display:flex;flex:1;min-height:0}
.atabs{width:220px;flex:none;background:#fff;border-right:1px solid var(--line);padding:10px 0}
.atabs button{display:flex;align-items:center;gap:10px;width:100%;padding:13px 18px;font-weight:700;text-align:left}
.atabs button.on{background:var(--red3);color:var(--red2);box-shadow:inset 5px 0 0 var(--red)}
.apane{flex:1;padding:18px 22px 50px;min-width:0;overflow:auto}
.apane h2{margin:0 0 4px;font-size:22px}
.apane .lead{color:var(--muted);margin:0 0 14px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.sw{position:relative;width:48px;height:28px;flex:none}
.sw input{position:absolute;inset:0;opacity:0;margin:0;cursor:pointer;z-index:1}
.sw i{position:absolute;inset:0;border-radius:14px;background:#b5c0bc;transition:.15s}
.sw i::after{content:"";position:absolute;left:3px;top:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:.15s}
.sw input:checked+i{background:var(--leaf)}
.sw input:checked+i::after{left:23px}
.cfg{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:8px;align-items:end;margin:8px 0}
.cfg label{font-size:12.5px;font-weight:700;color:var(--muted);display:block;margin-bottom:2px}
.mtile{width:100px;height:64px;border-radius:10px;background:#fff;border:2px solid #b7c1bd;display:flex;flex-direction:column;align-items:center;justify-content:center;font-weight:800}
.mtile small{font-weight:600;color:var(--muted);font-size:11.5px}
.mtile:hover{border-color:var(--red)}
.addt{width:44px;height:64px;border-radius:10px;border:2px dashed #b7c1bd;color:var(--muted);display:grid;place-items:center}
.mcols{display:grid;grid-template-columns:1fr 1fr 1.7fr;gap:12px;align-items:start}
.mcol{background:#fff;border:1px solid var(--line);border-radius:12px;overflow:hidden}
.mcol>h3{margin:0;padding:10px 14px;background:#e4e7e8;font-size:15px;display:flex;justify-content:space-between}
.mrow{display:flex;align-items:center;gap:2px;padding:2px 6px 2px 0;border-bottom:1px solid #edf1ef}
.mrow .sel{flex:1;text-align:left;padding:10px 12px;font-weight:600;min-width:0}
.mrow.on{background:var(--leaf2)}
.mrow .sel small{display:block;color:var(--muted);font-weight:500}
.dot{display:inline-block;width:11px;height:11px;border-radius:2px;margin-right:6px;background:#b9c3c0;vertical-align:-1px}
.dot.v{background:#2fa860}.dot.n{background:var(--non)}.dot.e{background:#f2b800}
.addrow{display:flex;gap:8px;padding:10px}
.mx td,.mx th{padding:6px 8px;border-bottom:1px solid #e6ebe8;text-align:left;vertical-align:middle}
.mx th{font-size:13px;background:#e4e7e8}
.mx td.c,.mx th.c{text-align:center}
.pill{display:inline-flex;align-items:center;gap:6px;background:#eef2f0;border-radius:999px;padding:5px 6px 5px 12px;font-weight:600}
.pill button{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;color:var(--chilli)}
.chk{width:22px;height:22px;accent-color:var(--red)}

/* ---------- responsive ---------- */
@media (max-width:1150px){
  .cart{width:380px}
  .brow.r6 .ab{font-size:11px}
  .mcols{grid-template-columns:1fr 1fr}.mcols .mcol:last-child{grid-column:1/-1}
  .billno{width:90px}
}
@media (max-width:900px){
  .top{flex-wrap:wrap;gap:8px;padding:6px 10px}
  .brand{font-size:17px}
  .ttl{padding-left:0;border:0;font-size:15px}
  .help{font-size:11px;padding:3px 8px;margin-left:auto}
  .help .ph{font-size:14px}
  .help .hl{display:none}
  .chip em{display:none}
  .tbicons{order:9;width:100%;justify-content:space-around}
  .billno{display:none}
  .big3{grid-template-columns:1fr}
  .bt{flex-direction:row;padding:14px 18px;gap:14px;text-align:left}
  .bt .badge{width:64px;height:64px;margin:0}
  .bt>div{display:flex;flex-direction:column}
  .order{flex-direction:column}
  .groups{width:100%;flex-direction:row;height:50px}
  .groups .ph2{display:none}
  .glist{display:flex;overflow-x:auto;overflow-y:hidden}
  .g{width:auto;white-space:nowrap;border-bottom:0;border-right:1px solid #6b7276;padding:0 18px;font-size:15px}
  .sg{display:none}
  .subchips{display:flex;gap:6px;overflow-x:auto;padding:8px 12px;background:#f3f5f5;border-bottom:1px solid var(--line)}
  .subchips button{flex:none;padding:6px 14px;border-radius:999px;background:#fff;border:1.5px solid var(--line);font-weight:600;font-size:14px}
  .subchips button.on{background:var(--leaf);border-color:var(--leaf);color:#fff}
  .mtop{flex-wrap:wrap}
  .scbox{width:130px}
  .mtitle{display:none}
  .items{grid-template-columns:repeat(auto-fill,minmax(130px,1fr));padding:10px 10px 80px;gap:10px}
  .cart{position:fixed;left:0;right:0;bottom:0;width:100%;height:88vh;z-index:60;border-left:0;border-radius:16px 16px 0 0;box-shadow:0 -10px 40px rgba(0,0,0,.35);transform:translateY(105%);transition:transform .22s}
  .order.cart-open .cart{transform:none}
  .cartbar{display:flex;position:fixed;left:10px;right:10px;bottom:10px;z-index:50;background:var(--red);color:#fff;border-radius:12px;padding:0 18px;height:54px;align-items:center;justify-content:space-between;font-weight:800;font-size:17px;box-shadow:0 6px 20px rgba(0,0,0,.35)}
  .order.cart-open .cartbar{display:none}
  .cartclose{display:grid;margin-left:auto;width:48px;height:48px;place-items:center}
  .adm{flex-direction:column}
  .atabs{width:100%;display:flex;overflow-x:auto;padding:0;border-right:0;border-bottom:1px solid var(--line)}
  .atabs button{width:auto;white-space:nowrap;padding:12px 14px}
  .atabs button.on{box-shadow:inset 0 -4px 0 var(--red)}
  .mcols{grid-template-columns:1fr}
  .grid2,.two{grid-template-columns:1fr}
  .tables{padding:8px 12px 40px}
  .tbl{width:calc(33% - 6px);min-width:96px}
}
@media print{
  .top,.rtabs,.rbar,.no-print,.tw{display:none!important}
  body{background:#fff}
  .page{padding:0;max-width:none}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

.rcpt{font-family:'Courier New',ui-monospace,Menlo,monospace;font-size:12px;line-height:1.35;color:#000;width:100%}
.rcpt .c{text-align:center}
.rcpt .b{font-weight:700}
.rcpt .big{font-size:15px;font-weight:700}
.rcpt .nm{font-size:17px;font-weight:700;letter-spacing:.03em}
.rcpt hr{border:0;border-top:1px dashed #000;margin:5px 0}
.rcpt table{width:100%;border-collapse:collapse}
.rcpt td,.rcpt th{padding:1px 0;vertical-align:top;text-align:left;font-weight:inherit}
.rcpt th{border-bottom:1px dashed #000;font-weight:700}
.rcpt .r{text-align:right}
.rcpt .sub td{font-style:italic;font-size:11px;padding-left:8px}
.rcpt .kt td{font-size:14px;font-weight:700}
.rcpt .kt.sub td{font-size:12px;font-weight:400}
.rcpt .cx{text-decoration:line-through}
.rcpt .tot td{font-size:15px;font-weight:700;border-top:1px dashed #000;padding-top:3px}
.rcpt .gap{height:6px}

.chk{width:22px;height:22px;accent-color:var(--pea)}
</style>

/* ---------- short codes: 3 letters + a number for every dish ---------- */
function autoCode(name, taken) {
  const words = String(name).replace(/[^A-Za-z ]/g, ' ').toUpperCase().split(/\s+/).filter(Boolean);
  const flat = words.join('');
  let base;
  if (words.length >= 3) base = words[0][0] + words[1][0] + words[2][0];
  else if (words.length === 2) base = words[0][0] + words[1][0] + (words[1][1] || words[0][1] || 'X');
  else base = (flat + 'XXX').slice(0, 3);
  if (!taken.has(base)) return base;
  for (let i = 0; i < flat.length; i++) { const c = base.slice(0, 2) + flat[i]; if (/^[A-Z]{3}$/.test(c) && !taken.has(c)) return c; }
  for (let i = 0; i < flat.length; i++) { const c = base[0] + flat[i] + base[2]; if (/^[A-Z]{3}$/.test(c) && !taken.has(c)) return c; }
  const A = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ';
  for (const x of A) for (const y of A) { const c = base[0] + x + y; if (!taken.has(c)) return c; }
  return base;
}
function assignCodes(menu) {
  const items = [];
  menu.groups.forEach(g => g.subs.forEach(s => s.items.forEach(i => items.push(i))));
  const codes = new Set(items.filter(i => i.code).map(i => i.code));
  const nums = new Set(items.filter(i => i.num).map(i => i.num));
  let n = 1;
  items.forEach(i => {
    if (!i.code) { i.code = autoCode(i.name, codes); codes.add(i.code); }
    if (!i.num) { while (nums.has(n)) n++; i.num = n; nums.add(n); }
  });
}

  const rows = [];

      const old = oldRows && oldRows[r] && oldRows[r][c];

function calcTotals(o) {
  const s = db.settings;
  const sub0 = r2(activeLines(o).reduce((t, l) => t + lineTotal(l), 0));
  if (o.comp) {
    return { sub: 0, disc: 0, delivery: 0, taxable: 0, taxes: s.taxes.map(t => ({ name: t.name, rate: t.rate, amount: 0 })), taxTotal: 0, roundOff: 0, total: 0, comp: true, compValue: sub0 };
  }
  const sub = sub0;
  let disc = 0;
  if (o.discount && o.discount.value > 0) {
    disc = o.discount.mode === 'pct' ? sub * Math.min(100, o.discount.value) / 100 : Math.min(o.discount.value, sub);
    disc = r2(disc);

  const delivery = r2(num(o.delivery));
  const taxable = r2(sub - disc + (s.taxOnDelivery ? delivery : 0));
  const taxes = s.taxes.map(t => ({ name: t.name, rate: t.rate, amount: r2(taxable * t.rate / 100) }));
  const taxTotal = r2(taxes.reduce((t, x) => t + x.amount, 0));
  const raw = r2(sub - disc + delivery + taxTotal);
  const total = Math.round(raw);
  return { sub, disc, delivery, taxable, taxes, taxTotal, roundOff: r2(total - raw), total };
}

/* split one order into N equal bills */
function settleSplit(o, modes) {
  const T = calcTotals(o), N = modes.length;
  const each = Math.floor(T.total / N);
  const amts = modes.map((m, i) => i === N - 1 ? T.total - each * (N - 1) : each);
  const bills = [];
  const used = { sub: 0, disc: 0, delivery: 0, taxable: 0, taxes: T.taxes.map(() => 0) };
  amts.forEach((amt, i) => {
    const last = i === N - 1, f = T.total ? amt / T.total : 0;
    const part = (whole, k) => { const v = last ? r2(whole - k) : r2(whole * f); return v; };
    const sub = part(T.sub, used.sub), disc = part(T.disc, used.disc), delivery = part(T.delivery, used.delivery), taxable = part(T.taxable, used.taxable);
    used.sub = r2(used.sub + sub); used.disc = r2(used.disc + disc); used.delivery = r2(used.delivery + delivery); used.taxable = r2(used.taxable + taxable);
    const taxes = T.taxes.map((t, j) => { const a = part(t.amount, used.taxes[j]); used.taxes[j] = r2(used.taxes[j] + a); return { ...t, amount: a }; });
    const taxTotal = r2(taxes.reduce((a, t) => a + t.amount, 0));
    const totals = { sub, disc, delivery, taxable, taxes, taxTotal, roundOff: r2(amt - (sub - disc + delivery + taxTotal)), total: amt };
    const pay = Object.assign(emptyPay(), { mode: modes[i], [modes[i]]: amt, tendered: modes[i] === 'cash' ? amt : 0 });
    const b = makeBill(o, totals, pay, { splitNo: i + 1, splitOf: N, splitTotal: T.total });
    if (i > 0) { b.lines = []; b.persons = 0; }
    bills.push(b);
  });
  bills.forEach(b => db.bills.push(b));
  rememberCustomer(o, 0);
  delete db.orders[o.id];
  save();
  return bills;
}

let RCPT_CSS = '';
function printHTML(bodies) {
  const w = db.settings.paper === 58 ? 58 : 80;
  const html = `<!doctype html><html><head><meta charset="utf-8"><title>Print</title><style>
    @page{size:${w}mm auto;margin:2mm}
    html,body{margin:0;padding:0;background:#fff}
    body{width:${w - 4}mm}
    ${RCPT_CSS}
    .rcpt{font-size:${w === 58 ? 11 : 12}px}
    .cut{page-break-after:always;margin-bottom:6mm}
  </style></head><body>${bodies.map(b => `<div class="cut">${b}</div>`).join('')}</body></html>`;
  const f = document.createElement('iframe');
  f.setAttribute('aria-hidden', 'true');
  f.style.cssText = 'position:fixed;right:0;bottom:0;width:0;height:0;border:0;visibility:hidden';
  document.body.appendChild(f);
  const d = f.contentWindow.document;
  d.open(); d.write(html); d.close();
  setTimeout(() => {
    try { f.contentWindow.focus(); f.contentWindow.print(); } catch (e) { toast('Could not open the printer. Check the printer connection.', 'err'); }
    setTimeout(() => f.remove(), 2500);
  }, 200);
}

}

const qtyMap = o => { const m = {}; activeLines(o).forEach(l => { m[l.itemId] = (m[l.itemId] || 0) + l.qty; }); return m; };

/* ---------- dishes ---------- */
function tileHTML(i, label, qm) {
  const q = qm[i.id] || 0;
  return `<button class="it ${i.diet || ''} ${i.active ? '' : 'off'} ${i.img ? 'hasimg' : ''}" data-act="tapItem" data-id="${i.id}" data-item="${i.id}">
    ${i.img ? `<img class="ti" src="${i.img}" alt="">` : ''}<b>${esc(i.name)}</b><span class="pr">${i.active ? priceRange(i) : 'Not available'}</span>${label ? `<span class="lb">${esc(label)}</span>` : ''}
    <span class="cd">${esc(i.code)} · ${i.num}</span><span class="qb" ${q ? '' : 'hidden'}>${q || ''}</span></button>`;
}
const openTile = () => db.settings.allowOpenItem ? `<button class="it open" data-act="openItemModal"><b>Open Item</b><span class="pr">Type name &amp; price</span></button>` : '';
function itemsHTML() {
  const o = ord(), qm = qtyMap(o), q = ui.q.trim().toLowerCase();
  if (q) {
    const toks = q.split(/\s+/), hits = allItems().filter(({ item: i, group: g, sub: s }) => {
      const hay = (i.name + ' ' + g.name + ' ' + s.name + ' ' + i.variants.map(v => v.name).join(' ')).toLowerCase();
      return toks.every(t => hay.includes(t));
    });
    if (!hits.length) return `<div class="empty">No dish found for “${esc(ui.q)}”.</div>`;
    return hits.map(h => tileHTML(h.item, h.group.name + (h.group.subs.length > 1 ? ' › ' + h.sub.name : ''), qm)).join('');
  }
  if (ui.g === 'fav') {
    const fs = allItems().filter(x => x.item.fav);
    return (fs.length ? fs.map(x => tileHTML(x.item, '', qm)).join('') : `<div class="empty" style="grid-column:1/-1"><b>No favourite dishes yet.</b><br>The Owner can star dishes in Admin &rsaquo; Menu.</div>`) + openTile();
  }
  const g = db.menu.groups.find(x => x.id === ui.g);
  if (!g) return `<div class="empty">The menu is empty. The Owner can add it in Admin &rsaquo; Menu.</div>`;
  const subs = ui.s ? g.subs.filter(s => s.id === ui.s) : g.subs;
  if (!subs.reduce((n, s) => n + s.items.length, 0)) return `<div class="empty"><b>No dishes in ${esc(g.name)} yet.</b><br>The Owner can add dishes in Admin &rsaquo; Menu.</div>`;
  const multi = g.subs.length > 1 && !ui.s;
  return subs.map(s => (multi && s.items.length ? `<div class="sh">${esc(s.name)}</div>` : '') + s.items.map(i => tileHTML(i, '', qm)).join('')).join('');
}

/* ---------- short code (3 letters or number) ---------- */
function scMatches(q) {
  q = q.trim().toUpperCase(); if (!q) return [];
  const all = allItems().filter(x => x.item.active); let ex, pre;
  if (/^\d+$/.test(q)) { const n = Number(q); ex = all.filter(x => x.item.num === n); pre = all.filter(x => x.item.num !== n && String(x.item.num).startsWith(q)); }
  else { ex = all.filter(x => x.item.code === q); pre = all.filter(x => x.item.code !== q && x.item.code.startsWith(q)); }
  return [...ex, ...pre].slice(0, 6);
}
function updateScList() {
  const l = $('#scl'); if (!l) return;
  const ms = scMatches(ui.sc || '');
  l.hidden = !ms.length;
  l.innerHTML = ms.map((m, i) => `<button class="${i === 0 ? 'on' : ''}" data-act="scPick" data-id="${m.item.id}"><span>${esc(m.item.name)}</span><small>${esc(m.item.code)} · ${m.item.num}</small></button>`).join('');
}

  const o = ord(); addLine(o, mkLine(item)); touch(o); refreshCart(true); updateBadges();
  if (window.innerWidth <= 900) toast('Added: ' + item.name, 'ok');
}

ACT.scGo = () => {

ACT.lnUp = () => { const l = ord().lines.find(x => x.id === ui.m.lineId); ui.m.n = Math.min(l.qty, ui.m.n + 1); renderModal(); };

IN.lnText = el => { ui.m.text = el.value; };
ACT.lnSave = () => {
  const o = ord(), m = ui.m, l = o.lines.find(x => x.id === m.lineId); if (!l) return closeModal();
  const n = Math.max(1, Math.min(m.n, l.qty)), notes = [...m.notes], text = (m.text || '').trim();
  let target = l;
  if (n >= l.qty) { l.notes = notes; l.text = text; }
  else {
    l.qty -= n;
    target = Object.assign(clone(l), { id: uid('l'), qty: n, notes, text, extras: [] });
    o.lines.splice(o.lines.indexOf(l) + 1, 0, target);
  }
  const dup = o.lines.find(x => x !== target && !x.kotId && !x.void && lineSig(x) === lineSig(target));
  if (dup) { dup.qty += target.qty; o.lines.splice(o.lines.indexOf(target), 1); }
  o.hold = false; o.billPrinted = false; touch(o); closeModal(); refreshCart(); updateBadges(); toast('Notes saved', 'ok');
};

/* item popup (variations, extras, notes) */
function extrasCost(map) { return Object.entries(map).reduce((s, [id, q]) => { const e = db.extras.find(x => x.id === id); return s + (e ? e.price * q : 0); }, 0); }

  };
  showModal(itemModal);
}
function itemModal() {
  const m = ui.m, f = findItem(m.itemId), it = f ? f.item : m.stub;
  const v = it.variants.find(x => x.id === m.variantId);
  const unit = v ? v.price : it.price, total = unit * m.qty + extrasCost(m.extras);
  const needV = it.variants.length && !v;
  return {
    title: esc(it.name), cls: '',
    body: `

      ${it.extras && db.extras.length ? `<label class="f">Extra (sides)</label><div class="opts">${db.extras.map(e => {
        const q = m.extras[e.id] || 0;
        return `<div class="xtra ${q ? 'on' : ''}"><div><b>${esc(e.name)}</b><br><small class="muted">${money(e.price)}</small></div>
          <div class="stp"><button data-act="mExt" data-id="${e.id}" data-d="-1" aria-label="Less ${esc(e.name)}">${ic('minus', 16)}</button><b>${q}</b><button data-act="mExt" data-id="${e.id}" data-d="1" aria-label="More ${esc(e.name)}">${ic('plus', 16)}</button></div></div>`;
      }).join('')}</div>` : ''}
      ${notePicker(m)}
      <label class="f" for="mtext">Other request (type)</label>
      <input class="in" id="mtext" placeholder="e.g. less spicy, no onion" value="${esc(m.text)}" data-in="mText">
      <label class="f">Quantity</label>
      <div class="stp" style="margin:0"><button data-act="mQty" data-d="-1" aria-label="Less">${ic('minus', 18)}</button><b style="font-size:20px">${m.qty}</b><button data-act="mQty" data-d="1" aria-label="More">${ic('plus', 18)}</button></div>`,
    foot: `<div class="tot">${money(total)}</div><button class="btn" data-act="closeModal">Cancel</button><button class="btn pri lg" data-act="mSave" ${needV ? 'disabled' : ''}>Save</button>`,
  };
}
ACT.mVar = el => { ui.m.variantId = el.dataset.id; renderModal(); };
ACT.mExt = el => { const id = el.dataset.id, q = Math.max(0, Math.min(20, (ui.m.extras[id] || 0) + Number(el.dataset.d))); if (q) ui.m.extras[id] = q; else delete ui.m.extras[id]; renderModal(); };
ACT.mQty = el => { ui.m.qty = Math.max(1, Math.min(99, ui.m.qty + Number(el.dataset.d))); renderModal(); };
IN.mText = el => { ui.m.text = el.value; };
ACT.mSave = () => {
  const m = ui.m, o = ord(), f = findItem(m.itemId), it = f ? f.item : m.stub;
  if (it.variants.length && !m.variantId) return;
  if (m.lineId) {
    const l = o.lines.find(x => x.id === m.lineId);
    if (l) {
      const v = it.variants.find(x => x.id === m.variantId);
      if (v) { l.variant = v.name; l.price = v.price; }
      l.qty = m.qty; l.notes = [...m.notes]; l.text = m.text.trim(); l.extras = mkExtras(m.extras);
      const dup = o.lines.find(x => x !== l && !x.kotId && !x.void && lineSig(x) === lineSig(l));
      if (dup) { dup.qty += l.qty; o.lines.splice(o.lines.indexOf(l), 1); }
      o.hold = false; o.billPrinted = false;
    }
  } else addLine(o, mkLine(it, { variantId: m.variantId, extras: m.extras, notes: m.notes, text: m.text, qty: m.qty }));
  touch(o); closeModal(); refreshCart(!m.lineId); updateBadges();
};

function finishSettle(o, pay, print) {
  const run = extra => {
    const bill = settleOrder(o, pay);
    ui.pending = null; ui.ord = null; closeModal();
    const bodies = [...(extra || [])]; if (print) bodies.push(billHTML(bill, false));

  };
  if (unsentLines(o).length) {
    ask('Some dishes are not sent to the kitchen yet. Send a KOT now and finish the bill?', 'Send KOT & finish', () => { const k = makeKOT(o); run(k ? [kotHTML(o, k)] : []); });
  } else run();
}
function quickSettle(print) {
  const o = ord(), T = calcTotals(o);
  if (o.comp) return finishSettle(o, Object.assign(emptyPay(), { mode: 'comp' }), print);
  if (o.payMode === 'cash' || o.payMode === 'card' || o.payMode === 'upi') {
    const m = o.payMode;
    return finishSettle(o, Object.assign(emptyPay(), { mode: m, [m]: T.total, tendered: m === 'cash' ? T.total : 0 }), print);
  }
  if (o.payMode === 'part') return openPartPage();
  openSettle();
}
function openSettle() {
  const o = ord(), types = db.settings.otherTypes;
  ui.m = { mode: o.payMode || 'cash', paid: '', tip: '', settle: '', otherType: o.otherType || types[0] || 'Other', note: o.otherNote || '', phone: o.customer.phone || '', name: o.customer.name || '' };
  if (ui.m.mode === 'part') return openPartPage();
  showModal(settleModal);
}
function settleCheck() {
  const o = ord(), T = calcTotals(o), m = ui.m;
  if (o.comp) return { ok: true, pay: Object.assign(emptyPay(), { mode: 'comp' }), html: 'Complimentary – nothing to collect.' };
  const settle = m.settle === '' ? T.total : num(m.settle), tip = Math.max(0, num(m.tip));
  if (settle < 0 || settle > T.total) return { ok: false, html: `<span class="err">Settlement amount must be between ₹0 and ${money(T.total)}.</span>` };
  const waived = r2(T.total - settle);
  const base = Object.assign(emptyPay(), { mode: m.mode, tip, waived });
  const wtxt = waived > 0 ? `<div>Waived off: <b>${money(waived)}</b></div>` : '';
  if (m.mode === 'cash') {
    const paid = m.paid === '' ? settle + tip : num(m.paid);
    if (paid < settle + tip) return { ok: false, html: `<span class="err">Customer paid ${money(r2(settle + tip - paid))} less.</span>` };
    const change = r2(paid - settle - tip);
    return { ok: true, pay: Object.assign(base, { cash: settle, tendered: paid, change }), html: `Return to Customer: <b style="font-size:22px">${money(change)}</b>${wtxt}` };
  }
  if (m.mode === 'card' || m.mode === 'upi') return { ok: true, pay: Object.assign(base, { [m.mode]: settle }), html: `Collect <b>${money(settle)}</b> on the ${m.mode === 'card' ? 'card machine' : 'UPI'}.${wtxt}` };
  if (m.mode === 'other') return { ok: true, pay: Object.assign(base, { other: settle, otherType: m.otherType, otherBreak: { [m.otherType]: settle } }), html: `Collect <b>${money(settle)}</b> by ${esc(m.otherType)}.${wtxt}` };
  if (m.mode === 'due') {
    if (waived > 0) return { ok: false, html: `<span class="err">A due bill cannot have a waived-off amount.</span>` };
    if (phoneKey(m.phone).length < 10 || !(m.name || '').trim()) return { ok: false, html: `<span class="err">Type the customer's name and 10-digit mobile number.</span>` };
    const c = db.customers[phoneKey(m.phone)];
    return { ok: true, pay: Object.assign(base, { due: settle }), html: `<b>${money(settle)}</b> will be added to this customer's due${c && c.due > 0 ? ` (earlier due ${money(c.due)})` : ''}.` };
  }
  return { ok: false, html: '' };
}

};
ACT.partGo = el => {
  const o = ord(), P = ui.part, T = calcTotals(o), paid = r2(P.lines.reduce((a, l) => a + l.amount, 0)), rest = r2(T.total - paid);
  if (rest < 0) return toast('Payments are more than the bill.', 'err');
  if (P.lines.some(l => l.mode === 'due') && !(o.customer.phone && o.customer.name)) return toast('Customer name and mobile are needed for Due.', 'err');
  const pay = Object.assign(emptyPay(), { mode: 'part', cash: rest, tendered: rest, parts: clone(P.lines) });
  P.lines.forEach(l => { pay[l.mode] = r2(pay[l.mode] + l.amount); if (l.mode === 'other') pay.otherBreak[l.type] = r2((pay.otherBreak[l.type] || 0) + l.amount); });
  finishSettle(o, pay, el.dataset.print === '1');
};

/* ---------- split bill (equal parts) ---------- */
ACT.oSplit = () => {
  if (!can('bill')) return deny();
  const o = ord(); if (!hasItems(o)) return toast('Add at least one dish first.', 'err');
  if (o.comp) return toast('A complimentary bill cannot be split.', 'err');
  ui.m = { n: 2, modes: ['cash', 'cash'] };
  showModal(splitModal);
};
function splitModal() {
  const o = ord(), T = calcTotals(o), m = ui.m, each = Math.floor(T.total / m.n);
  const amts = m.modes.map((x, i) => i === m.n - 1 ? T.total - each * (m.n - 1) : each);
  return {
    title: `${ic('split', 20)} Split Bill – ${money(T.total)}`, cls: '',
    body: `<label class="f">Split into how many equal bills?</label>
      <div class="row"><div class="stp" style="margin:0"><button data-act="spDn" aria-label="Less">${ic('minus', 18)}</button><b style="font-size:22px">${m.n}</b><button data-act="spUp" aria-label="More">${ic('plus', 18)}</button></div>
      <div class="qamt" style="margin:0">${[2, 3, 4, 5, 6, 8, 10].map(n => `<button data-act="spSet" data-v="${n}">${n}</button>`).join('')}</div></div>
      <label class="f">Each bill and how it is paid</label>
      ${amts.map((a, i) => `<div class="row" style="justify-content:space-between;padding:5px 0;border-bottom:1px solid #edf1ef"><span>Bill ${i + 1} of ${m.n}</span><b>${money(a)}</b>
        <select class="in sm" style="width:110px" data-in="spMode" data-i="${i}" aria-label="Payment for bill ${i + 1}">${[['cash', 'Cash'], ['card', 'Card'], ['upi', 'UPI']].map(([k, l]) => `<option value="${k}" ${m.modes[i] === k ? 'selected' : ''}>${l}</option>`).join('')}</select></div>`).join('')}`,
    foot: `<button class="btn" data-act="closeModal">Cancel</button><button class="btn pri lg" data-act="spGo">${ic('printer', 20)} Settle &amp; print all</button>`,
  };
}
function spN(n) { n = Math.max(2, Math.min(20, n)); const m = ui.m; while (m.modes.length < n) m.modes.push(m.modes[m.modes.length - 1] || 'cash'); m.modes.length = n; m.n = n; renderModal(); }
ACT.spUp = () => spN(ui.m.n + 1);
ACT.spDn = () => spN(ui.m.n - 1);
ACT.spSet = el => spN(Number(el.dataset.v));
IN.spMode = el => { ui.m.modes[Number(el.dataset.i)] = el.value; };
ACT.spGo = () => {
  const o = ord(), modes = [...ui.m.modes];
  const run = extra => {
    const bills = settleSplit(o, modes);
    ui.pending = null; ui.ord = null; closeModal();
    printHTML([...(extra || []), ...bills.map(b => billHTML(b, false))]);
    toast(bills.length + ' bills settled', 'ok'); go(o.type === 'dine' ? 'tables' : 'list', { type: o.type });
  };
  if (unsentLines(o).length) ask('Some dishes are not sent to the kitchen yet. Send a KOT now and finish?', 'Send KOT & finish', () => { const k = makeKOT(o); run(k ? [kotHTML(o, k)] : []); });
  else run();
};

      <td><input class="in sm" value="${esc(u.loginId)}" data-ch="userF" data-id="${u.id}" data-f="loginId" aria-label="Login ID" style="min-width:110px"></td>

CH.roleRight = el => {
  const r = roleById(el.dataset.role); if (!r || r.id === 'owner') return;
  const k = el.dataset.right, i = r.rights.indexOf(k);
  if (el.checked && i < 0) r.rights.push(k); else if (!el.checked && i >= 0) r.rights.splice(i, 1);
  save(); toast('Saved', 'ok');
};
ACT.addRole = () => {
  const inp = $('#newRole'), name = inp.value.trim(); if (!name) return inp.focus();
  if (db.roles.some(r => r.name.toLowerCase() === name.toLowerCase())) return toast('This category already exists.', 'err');
  db.roles.push({ id: uid('r'), name, sys: false, rights: [] }); save(); render();
};
ACT.delRole = el => {
  const r = roleById(el.dataset.id); if (!r || r.sys) return;
  if (db.users.some(u => u.roleId === r.id)) return toast('Some profiles use this category. Move them to another category first.', 'err');
  ask(`Delete category <b>${esc(r.name)}</b>?`, 'Delete', () => { db.roles = db.roles.filter(x => x.id !== r.id); save(); render(); }, { danger: true });
};
CH.userF = el => {
  const u = db.users.find(x => x.id === el.dataset.id); if (!u) return;
  const f = el.dataset.f, v = el.type === 'checkbox' ? el.checked : el.value.trim();
  if (f === 'loginId') {
    if (!/^[A-Za-z0-9._-]{2,20}$/.test(v)) return bad('Login ID must be 2–20 letters or numbers, no spaces.');
    if (db.users.some(x => x !== u && x.loginId.toLowerCase() === v.toLowerCase())) return bad('This Login ID is already used by someone else.');
  }
  if (f === 'pin' && !/^\d{4,8}$/.test(v)) return bad('PIN must be 4 to 8 digits (numbers only).');
  if (f === 'name' && !v) return bad('Name cannot be empty.');
  if (isLastOwner(u) && ((f === 'active' && !v) || (f === 'roleId' && v !== 'owner'))) return bad('At least one active Owner login is needed.');
  u[f] = v; save(); toast('Saved', 'ok');
};
ACT.addUser = () => {
  if (db.users.length >= LIMITS.users) return toast(`Maximum ${LIMITS.users} login profiles are allowed.`, 'err');
  let n = db.users.length + 1; while (db.users.some(u => u.loginId.toLowerCase() === 'user' + n)) n++;
  let pin; do { pin = String(1000 + Math.floor(Math.random() * 9000)); } while (db.users.some(u => u.pin === pin));
  db.users.push({ id: uid('u'), loginId: 'user' + n, name: 'New user', pin, roleId: 'captain', active: true });
  save(); render(); toast('Profile added. Change the name, ID and PIN.', 'ok');
};
ACT.delUser = el => {
  const u = db.users.find(x => x.id === el.dataset.id); if (!u) return;
  if (isLastOwner(u)) return toast('At least one active Owner login is needed.', 'err');
  if (db.settings.live && curUser() && curUser().id === u.id) return toast('You cannot delete the login you are using.', 'err');
  ask(`Delete login <b>${esc(u.loginId)}</b> (${esc(u.name)})?`, 'Delete', () => { db.users = db.users.filter(x => x.id !== u.id); save(); render(); }, { danger: true });
};

/* ---------- Table layout ---------- */
ADM.layout = () => `<h2>Table layout</h2>
  <p class="lead">Up to 10 sections. Switch a section on, type the number of rows and columns, then press <b>Build tables</b> – tables are numbered automatically. Tap any table to change its name or seats.</p>

    const c = sec.cfg, n = sec.rows.reduce((a, r) => a + r.length, 0);

    <div class="row"><label class="sw"><input type="checkbox" data-ch="secOn" data-id="${sec.id}" ${sec.enabled ? 'checked' : ''} aria-label="Use this section"><i></i></label>

      <span class="muted">${sec.enabled ? n + ' table' + (n === 1 ? '' : 's') : 'Not in use'}</span></div>
    ${sec.enabled ? `<div class="cfg">
      <div><label>Name starts with</label><input class="in sm" value="${esc(c.prefix)}" maxlength="6" data-ch="secCfg" data-id="${sec.id}" data-f="prefix"></div>

      <div><label>Standing tables</label><label class="sw"><input type="checkbox" data-ch="secStand" data-id="${sec.id}" ${c.standing ? 'checked' : ''} aria-label="Standing tables"><i></i></label></div>
      <div><button class="btn pri sm" data-act="secBuild" data-id="${sec.id}">Build tables</button></div></div>
      ${sec.rows.length ? sec.rows.map((row, ri) => `<div class="trow" style="align-items:center;margin-bottom:8px">${row.map(t => `<button class="mtile" data-act="editTable" data-sec="${sec.id}" data-id="${t.id}" aria-label="Edit table ${esc(t.name)}">${esc(t.name)}<small>${t.standing ? 'standing' : t.seats + ' seats'}</small></button>`).join('')}<button class="addt" data-act="addTable" data-sec="${sec.id}" data-row="${ri}" aria-label="Add a table to row ${ri + 1}">${ic('plus', 20)}</button></div>`).join('') + `<button class="btn sm" data-act="addRow" data-sec="${sec.id}">${ic('plus', 16)} Add a row</button>`
        : `<p class="muted">No tables yet. Press <b>Build tables</b>.</p>`}` : ''}
  </div>`;
  }).join('')}`;

const secById = id => db.layout.find(s => s.id === id);
const tableNameTaken = (name, exceptId) => allTables().some(t => t.id !== exceptId && t.name.toLowerCase() === name.toLowerCase());
CH.secName = el => { const s = secById(el.dataset.id), v = el.value.trim(); if (!v) return bad('Section name cannot be empty.'); s.name = v; save(); toast('Saved', 'ok'); };
CH.secOn = el => {
  const s = secById(el.dataset.id);
  if (!el.checked) {
    const busy = s.rows.flat().find(t => tableInUse(t.id));
    if (busy) return bad(`Table ${busy.name} has a running order. Finish it before switching this section off.`);
    s.enabled = false;
  } else {
    s.enabled = true;
    if (!s.rows.length) {
      const rows = buildRows(s.cfg);
      const dup = rows.flat().find(t => tableNameTaken(t.name));
      if (dup) { s.enabled = false; return bad(`Table name ${dup.name} is already used. Change "Name starts with" first.`); }
      s.rows = rows;
    }
  }
  save(); render();
};
CH.secCfg = el => {
  const s = secById(el.dataset.id), f = el.dataset.f;
  if (f === 'prefix') s.cfg.prefix = el.value.trim();
  else if (f === 'seats') s.cfg.seats = el.value.trim();
  else { const lim = f === 'rows' ? 10 : 15; s.cfg[f] = Math.max(1, Math.min(lim, Math.round(num(el.value)) || 1)); el.value = s.cfg[f]; }
  save();
};
CH.secStand = el => { const s = secById(el.dataset.id); s.cfg.standing = el.checked; save(); render(); };
ACT.secBuild = el => {
  const s = secById(el.dataset.id), rows = buildRows(s.cfg, s.rows);
  const keep = new Set(rows.flat().map(t => t.id));
  const busy = s.rows.flat().find(t => !keep.has(t.id) && tableInUse(t.id));
  if (busy) return toast(`Table ${busy.name} has a running order. Finish it before making the section smaller.`, 'err');
  const otherDup = rows.flat().find(t => db.layout.some(x => x !== s && x.enabled && x.rows.flat().some(o => o.name.toLowerCase() === t.name.toLowerCase())));
  if (otherDup) return toast(`Table name ${otherDup.name} is already used in another section. Change "Name starts with".`, 'err');
  const go2 = () => { s.rows = rows; save(); render(); toast('Tables built', 'ok'); };
  if (s.rows.length) ask(`Rebuild <b>${esc(s.name)}</b>? All tables in this section are renumbered.`, 'Rebuild', go2); else go2();
};
ACT.editTable = el => {
  const s = secById(el.dataset.sec), t = s.rows.flat().find(x => x.id === el.dataset.id); if (!t) return;
  ui.m = { secId: s.id, id: t.id, name: t.name, seats: t.seats || 4, standing: t.standing };
  showModal(() => ({
    title: 'Edit table', cls: 'narrow',
    body: `<label class="f" for="tname">Table name (used on the KOT)</label><input class="in" id="tname" value="${esc(ui.m.name)}" data-in="tf" data-f="name" data-autofocus>
      <label class="f" for="tseats">Seats</label><input class="in" id="tseats" type="number" min="1" max="30" value="${ui.m.seats}" data-in="tf" data-f="seats" ${ui.m.standing ? 'disabled' : ''}>
      <div class="row" style="margin-top:14px"><label class="sw"><input type="checkbox" data-in="tf" data-f="standing" ${ui.m.standing ? 'checked' : ''} aria-label="Standing table"><i></i></label><span>Standing table</span></div>`,
    foot: `<button class="btn red" data-act="tDelete" style="margin-right:auto">${ic('trash', 16)} Delete table</button><button class="btn" data-act="closeModal">Cancel</button><button class="btn pri" data-act="tSave">Save</button>`,
  }));
};
IN.tf = el => {
  const f = el.dataset.f;
  if (f === 'standing') { ui.m.standing = el.checked; renderModal(); } else ui.m[f] = el.value;
};
ACT.tSave = () => {
  const m = ui.m, s = secById(m.secId), t = s.rows.flat().find(x => x.id === m.id), name = m.name.trim();
  if (!name) return toast('Table name cannot be empty.', 'err');
  if (tableNameTaken(name, t.id)) return toast('This table name is already used.', 'err');
  t.name = name; t.standing = !!m.standing; t.seats = m.standing ? 0 : Math.max(1, Math.round(num(m.seats)) || 4);
  save(); closeModal(); render();
};
ACT.tDelete = () => {
  const m = ui.m, s = secById(m.secId), t = s.rows.flat().find(x => x.id === m.id);
  if (tableInUse(t.id)) return toast('This table has a running order.', 'err');
  s.rows = s.rows.map(r => r.filter(x => x.id !== t.id)).filter(r => r.length);
  save(); closeModal(); render();
};
ACT.addTable = el => {
  const s = secById(el.dataset.sec), row = s.rows[Number(el.dataset.row)]; if (!row) return;
  let n = s.rows.flat().length + 1, name; do { name = s.cfg.prefix + (n++); } while (tableNameTaken(name));
  const last = row[row.length - 1];
  row.push({ id: uid('t'), name, seats: last ? last.seats : 4, standing: last ? last.standing : false }); save(); render();
};
ACT.addRow = el => {
  const s = secById(el.dataset.sec); let n = s.rows.flat().length + 1, name; do { name = s.cfg.prefix + (n++); } while (tableNameTaken(name));
  s.rows.push([{ id: uid('t'), name, seats: s.cfg.standing ? 0 : 4, standing: !!s.cfg.standing }]); save(); render();
};

ACT.itSave = () => {
  const m = ui.m, name = m.name.trim(); let price = num(m.price);
  if (!name) return toast('Please type the dish name.', 'err');
  if (!m.variants.length && price <= 0) return toast('Please type the price.', 'err');
  for (const v of m.variants) { if (!v.name.trim()) return toast('Every variation needs a name.', 'err'); if (num(v.price) <= 0) return toast('Every variation needs a price.', 'err'); }
  const others = allItems().map(x => x.item).filter(i => i.id !== m.id);
  let code = (m.code || '').trim().toUpperCase(), n = String(m.num || '').trim();
  if (code) {
    if (!/^[A-Z]{3}$/.test(code)) return toast('Short code must be exactly 3 letters (A–Z).', 'err');
    if (others.some(i => i.code === code)) return toast('Short code ' + code + ' is already used by another dish.', 'err');
  } else code = autoCode(name, new Set(others.map(i => i.code)));
  let numv;
  if (n) {
    if (!/^\d{1,4}$/.test(n) || Number(n) < 1) return toast('Short number must be 1 to 9999.', 'err');
    numv = Number(n);
    if (others.some(i => i.num === numv)) return toast('Short number ' + numv + ' is already used by another dish.', 'err');
  } else { const used = new Set(others.map(i => i.num)); numv = 1; while (used.has(numv)) numv++; }
  const g = db.menu.groups.find(x => x.id === m.gid), s = g.subs.find(x => x.id === m.sid);
  const data = { name, price, diet: m.diet, active: m.active, extras: m.extras, fav: !!m.fav, img: m.img || '', code, num: numv, variants: m.variants.map(v => ({ id: v.id, name: v.name.trim(), price: num(v.price) })) };
  if (m.id) Object.assign(s.items.find(x => x.id === m.id), data);
  else s.items.push({ id: uid('i'), ...data });
  save(); closeModal(); render(); toast('Dish saved', 'ok');
};

CH.imgFile = el => {
  const f = el.files[0]; if (!f) return;
  const url = URL.createObjectURL(f), im = new Image();
  im.onload = () => {
    const max = 320, k = Math.min(1, max / Math.max(im.width, im.height)), c = document.createElement('canvas');
    c.width = Math.round(im.width * k); c.height = Math.round(im.height * k);
    c.getContext('2d').drawImage(im, 0, 0, c.width, c.height);
    ui.m.img = c.toDataURL('image/jpeg', 0.8); URL.revokeObjectURL(url); renderModal();
  };
  im.onerror = () => { URL.revokeObjectURL(url); toast('This file is not a picture.', 'err'); };
  im.src = url;
};

/* paste many dishes at once */
function parseBulk(text) {
  return text.split(/\r?\n/).map(l => l.trim()).filter(Boolean).map(line => {
    const m = line.match(/^(.*?)[\s.:\-–—,=|…]+(?:rs\.?|₹|inr)?\s*(\d+(?:\.\d+)?)\s*(?:\/-)?$/i) || line.match(/^(.*?)(?:rs\.?|₹)\s*(\d+(?:\.\d+)?)\s*(?:\/-)?$/i);
    if (!m) return { line, bad: true };
    const name = m[1].replace(/^[\s\-*•.\d)]+(?=[A-Za-z(])/, '').replace(/[\s.:\-–—,=|…]+$/, '').trim();
    return name ? { name, price: parseFloat(m[2]) } : { line, bad: true };
  });
}
function bulkPreview() {
  const rows = parseBulk(ui.m.text);
  const ok = rows.filter(r => !r.bad);
  return rows.length ? `<b>${ok.length}</b> dish${ok.length === 1 ? '' : 'es'} found${rows.length > ok.length ? `, <span class="err">${rows.length - ok.length} line(s) without a price will be skipped</span>` : ''}.
    <div style="max-height:150px;overflow:auto;margin-top:6px">${ok.map(r => `<div class="kv"><span>${esc(r.name)}</span><span>${money(r.price)}</span></div>`).join('')}</div>` : '';
}

/* ---------- day-end tally ---------- */
function tallyOf(bs) {
  const t = { bills: 0, gross: 0, disc: 0, delivery: 0, tax: 0, round: 0, net: 0, waived: 0, comp: 0, cash: 0, card: 0, upi: 0, other: 0, due: 0, tips: 0, tipCash: 0, otherBreak: {} };
  bs.forEach(b => {
    const T = b.totals, p = b.pay || {};
    if (!(b.splitNo > 1)) t.bills++;
    t.gross += T.sub; t.disc += T.disc; t.delivery += T.delivery; t.tax += T.taxTotal; t.round += T.roundOff; t.net += T.total;
    t.waived += p.waived || 0; if (T.comp) t.comp += T.compValue || 0;
    t.cash += p.cash || 0; t.card += p.card || 0; t.upi += p.upi || 0; t.other += p.other || 0; t.due += p.due || 0;
    t.tips += p.tip || 0; if (p.mode === 'cash') t.tipCash += p.tip || 0;
    Object.entries(p.otherBreak || {}).forEach(([k, v]) => { t.otherBreak[k] = (t.otherBreak[k] || 0) + v; });
  });
  Object.keys(t).forEach(k => { if (typeof t[k] === 'number') t[k] = r2(t[k]); });
  return t;
}
REP.day = () => {
  const R = ui.rep, bs = billsIn(), t = tallyOf(bs);
  const toCollect = r2(t.net - t.waived), collected = r2(t.cash + t.card + t.upi + t.other), diff = r2(toCollect - collected - t.due);
  const rec = db.dueReceipts.filter(x => inRange(x.time));
  const recBy = { cash: 0, card: 0, upi: 0, other: 0 }; rec.forEach(x => { recBy[x.mode] = r2((recBy[x.mode] || 0) + x.amount); });
  const recTotal = r2(rec.reduce((a, x) => a + x.amount, 0));
  const expectedCash = r2(t.cash + t.tipCash + recBy.cash);
  const single = R.from === R.to, close = single ? db.dayClose[R.from] : null;
  const dues = Object.values(db.customers).filter(c => c.due > 0).sort((a, b) => b.due - a.due);
  const kv = (l, v, cls = '') => `<div class="kvr ${cls}"><span>${l}</span><span>${v}</span></div>`;
  ui.csv = { name: 'day-end', rows: [
    ['Day-end tally', dateLabel()], [], ['Bills', t.bills], ['Items total', t.gross], ['Discount', -t.disc], ['Delivery charge', t.delivery], ['Tax', t.tax], ['Round off', t.round],
    ['Net billing amount', t.net], ['Waived off', -t.waived], ['Amount to collect', toCollect], [], ['Cash', t.cash], ['Card', t.card], ['UPI', t.upi], ['Other', t.other],
    ...Object.entries(t.otherBreak).map(([k, v]) => ['  Other - ' + k, v]), ['Total collected', collected], ['Due (credit)', t.due], ['Collected + Due', r2(collected + t.due)], ['Difference', diff],
    [], ['Complimentary value (not billed)', t.comp], ['Tips received', t.tips], ['Due money received', recTotal] ] };
  return `<h2>Day-end tally – ${dateLabel()}</h2>
  <div class="stats"><div class="stat"><small>Bills</small><b>${t.bills}</b></div><div class="stat"><small>Net billing amount</small><b>${money(t.net)}</b></div>
    <div class="stat"><small>Collected (cash + card + UPI + other)</small><b>${money(collected)}</b></div><div class="stat"><small>Due (credit)</small><b>${money(t.due)}</b></div>
    <div class="stat ${diff === 0 ? 'ok' : 'bad'}"><small>Tally</small><b>${diff === 0 ? 'Tallied ✓' : 'Difference ' + money(diff)}</b></div></div>
  <div class="two">
    <div class="card"><h3>Billing amount</h3>
      ${kv('Items total', money(t.gross, 2))}${kv('Discount', '-' + money(t.disc, 2))}${kv('Delivery charge', money(t.delivery, 2))}${kv('Tax', money(t.tax, 2))}${kv('Round off', money(t.round, 2))}
      ${kv('Net billing amount', money(t.net, 2), 'b')}${kv('Waived off (bill settled for less)', '-' + money(t.waived, 2))}${kv('Amount to collect', money(toCollect, 2), 'b')}
      <p class="muted" style="margin:8px 0 0;font-size:13px">Complimentary (given free, not in billing): ${money(t.comp, 2)}</p></div>
    <div class="card"><h3>Money collected</h3>
      ${kv('Cash', money(t.cash, 2))}${kv('Card', money(t.card, 2))}${kv('UPI', money(t.upi, 2))}${kv('Other', money(t.other, 2))}
      ${Object.entries(t.otherBreak).map(([k, v]) => `<div class="kvr" style="padding-left:16px;color:var(--muted)"><span>${esc(k)}</span><span>${money(v, 2)}</span></div>`).join('')}
      ${kv('Total collected', money(collected, 2), 'b')}${kv('Due (on credit, not collected)', money(t.due, 2))}${kv('Collected + Due', money(r2(collected + t.due), 2), 'b')}
      <p class="${diff === 0 ? '' : 'err'}" style="margin:8px 0 0;font-weight:700">${diff === 0 ? '✓ Collected + Due matches the amount to collect.' : 'Difference of ' + money(diff, 2) + ' – please check the bills.'}</p></div>
  </div>
  <div class="two">
    <div class="card"><h3>Cash in the drawer</h3>
      ${kv('Cash from bills', money(t.cash, 2))}${kv('Cash tips', money(t.tipCash, 2))}${kv('Old dues received in cash', money(recBy.cash, 2))}${kv('Expected cash', money(expectedCash, 2), 'b')}
      ${single ? `<div class="row" style="margin-top:10px"><label for="counted" style="font-weight:600">Cash counted (₹)</label><input class="in" id="counted" inputmode="decimal" style="max-width:150px" value="${close ? close.counted : ''}" data-enter="dayClose"><button class="btn sm pri" data-act="dayClose">Save</button></div>
        ${close ? `<p style="margin:8px 0 0;font-weight:700" class="${r2(close.counted - expectedCash) === 0 ? '' : 'err'}">${r2(close.counted - expectedCash) === 0 ? '✓ Cash matches.' : (close.counted > expectedCash ? 'Cash extra ' : 'Cash short ') + money(Math.abs(r2(close.counted - expectedCash)), 2)} <span class="muted" style="font-weight:400">(saved by ${esc(close.by)} at ${hm(close.time)})</span></p>` : ''}` : '<p class="muted" style="margin:8px 0 0">Choose a single day to count the cash.</p>'}</div>
    <div class="card"><h3>Other money</h3>
      ${kv('Tips received (not part of bills)', money(t.tips, 2))}${kv('Old dues received (in this period)', money(recTotal, 2))}
      ${kv('Card / UPI / other dues received', money(r2(recBy.card + recBy.upi + recBy.other), 2))}</div>
  </div>
  <div class="card"><h3>Customers with due (credit)</h3>
    ${dues.length ? `<div class="scroll-x"><table class="dt"><thead><tr><th>Customer</th><th>Mobile</th><th class="r">Due</th><th></th></tr></thead><tbody>
      ${dues.map(c => `<tr><td>${esc(c.name || '-')}</td><td>${esc(c.phone)}</td><td class="r"><b>${money(c.due, 2)}</b></td><td class="r no-print">${can('bill') ? `<button class="btn sm" data-act="dueRecv" data-p="${c.phone}">Receive payment</button>` : ''}</td></tr>`).join('')}</tbody></table></div>` : '<p class="muted">Nobody owes money.</p>'}</div>`;
};

ACT.dueSave = () => {
